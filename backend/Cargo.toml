[package]
name = "synquay-server"
description = "Application and message gateway with MCP and a web management console"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tower-http = { version = "0.6.11", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
jsonschema = { version = "0.46", default-features = false }
url = "2.5"
ring = "0.17.14"
futures-util = "0.3"
httpdate = "1"
axum.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

thiserror.workspace = true
uuid.workspace = true

serde_json.workspace = true
tokio-util.workspace = true

rusqlite.workspace = true
reqwest.workspace = true
subtle.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
base64 = "0.22"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[package.metadata.deb]
name = "synquay"
maintainer = "Synquay maintainers"
copyright = "2026, Synquay contributors"
section = "net"
priority = "optional"
extended-description = "Application and message gateway with an MCP server, durable routing and a bundled React management console."
depends = "$auto, adduser, python3, ca-certificates, logrotate, init-system-helpers (>= 1.54~)"
assets = [
  ["target/release/synquay-server", "usr/bin/synquay-server", "755"],
  ["web-dist/**/*", "usr/share/synquay/web/", "644"],
  ["deploy/config/*.json", "usr/share/synquay/config/", "644"],
  ["deploy/initialize.py", "usr/share/synquay/initialize.py", "644"],
  ["deploy/synquay.env", "etc/synquay/synquay.env", "644"],
  ["deploy/synquay.env", "usr/share/synquay/synquay.env.example", "644"],
  ["deploy/logrotate/synquay", "etc/logrotate.d/synquay", "644"],
]
conf-files = ["/etc/synquay/synquay.env", "/etc/logrotate.d/synquay"]
maintainer-scripts = "deploy/scripts"

[package.metadata.deb.systemd-units]
unit-scripts = "deploy"
unit-name = "synquay"
enable = true
start = true
restart-after-upgrade = true
stop-on-upgrade = true
