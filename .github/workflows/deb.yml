name: Debian package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after verification
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: synquay-deb-amd64
          cache-on-failure: true
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config dpkg-dev python3
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-deb@3.6.0
      - name: Check release version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "synquay-server"))')
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$VERSION" ]]; then
            echo 'Tag must match the version in workspace Cargo.toml' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* || "$PRERELEASE" == true ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check backend and packaging
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python3 -m unittest discover -s scripts/tests -v
      - name: Build package
        run: bash scripts/build-deb.sh
      - name: Verify installation, upgrade and removal
        run: sudo bash scripts/test-deb.sh target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: synquay-deb-amd64
          path: |
            target/debian/*.deb
            target/debian/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish == true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: synquay-deb-amd64
          path: packages
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd packages
          sha256sum --check SHA256SUMS
          TAG="v$VERSION"
          # Never delete or overwrite an existing release/tag to retry a version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; increment the version instead of overwriting it.' >&2
            exit 1
          fi
          # A manually published release must not attach to a tag for another commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1 && [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Tag already exists; run the workflow on that tag or choose a new version.' >&2
            exit 1
          fi
          printf 'Synquay %s\n\nInstall: sudo apt install ./synquay_*.deb\nConsole: http://127.0.0.1:8080/\nService: systemctl status synquay\n' "$VERSION" > notes.txt
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" ./*.deb SHA256SUMS --target "$COMMIT" --title "Synquay $VERSION" --notes-file notes.txt "${flags[@]}"
